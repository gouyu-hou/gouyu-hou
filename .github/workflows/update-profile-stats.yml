name: update profile stats

on:
  schedule:
    # 每天 UTC 23:00，即北京时间次日 07:00
    - cron: "0 23 * * *"
    # 每天 UTC 15:00，即北京时间 23:00
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: node scripts/generate-profile.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          if git diff --quiet --cached; then
            echo "no stats change, skipping commit"
          else
            git commit -m "chore(profile): refresh merged PR stats"
            git push
          fi
